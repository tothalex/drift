[package]
name = "drift"
version = "0.21.0"
edition = "2024"
rust-version = "1.96"
description = "Review your working changes like a pull request, in the terminal"
license = "MIT"
repository = "https://github.com/tothalex/drift"

# Dev builds stay unoptimized for our own code (fast rebuilds), but
# dependencies — tree-sitter's C grammars, query compilation — get -O2:
# they dominate per-keystroke latency and rarely recompile.
[profile.dev.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
cc = "1.2.31"
clap = { version = "4.6.2", features = ["derive"] }
libloading = "0.8.9"
crossterm = "0.29.0"
gix = "0.85.0"
imara-diff = "0.2.0"
notify = "8"
notify-debouncer-full = "0.7.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
similar = "3.1.1"
streaming-iterator = "0.1.9"
thiserror = "2.0.18"
toml = "1.1.3"
tree-sitter = "0.26.11"
tree-sitter-language = "0.1.7"
self-replace = "1.5.0"
sha2 = "0.11.0"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
# No grammar ships in the binary — languages install as plugins. The
# unit-test registry statically links the versions the curated
# manifests pin, so the suite runs without git or a C compiler while
# exercising the exact queries `drift lang install` ships.
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
