# Curated by drift. Built in — installing makes it an editable plugin
# that overrides the built-in, starting from drift's full query stack.
# The rev matches the grammar crate the binary links (v0.25.0).
name = "python"
extensions = ["py"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-python"
rev = "293fdc02038ee2bf0e2e206711b69c90ac0d413f"
block_kinds = [
    "function_definition",
    "class_definition",
    "decorated_definition",
    "if_statement",
    "for_statement",
    "while_statement",
    "with_statement",
    "try_statement",
    "match_statement",
]
