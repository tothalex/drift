# Curated by drift. Built in — installing makes it an editable plugin
# that overrides the built-in, starting from drift's full query stack.
# The rev matches the grammar crate the binary links (v0.24.2), so the
# queries fit the parser.
name = "rust"
extensions = ["rs"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-rust"
rev = "77a3747266f4d621d0757825e6b11edcbf991ca5"
block_kinds = [
    "function_item",
    "impl_item",
    "trait_item",
    "struct_item",
    "enum_item",
    "mod_item",
    "macro_definition",
    "if_expression",
    "for_expression",
    "while_expression",
    "loop_expression",
    "match_expression",
]
