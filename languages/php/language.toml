# Curated by drift. Install: drift lang install php
name = "php"
extensions = ["php"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-php"
rev = "5b5627faaa290d89eb3d01b9bf47c3bb9e797dea"
path = "php"
block_kinds = [
    "function_definition",
    "method_declaration",
    "class_declaration",
    "interface_declaration",
    "trait_declaration",
    "enum_declaration",
    "namespace_definition",
    "if_statement",
    "for_statement",
    "foreach_statement",
    "while_statement",
    "do_statement",
    "switch_statement",
    "try_statement",
]
