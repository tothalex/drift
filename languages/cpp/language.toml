# Curated by drift. Install: drift lang install cpp
name = "cpp"
extensions = ["cpp", "cc", "cxx", "hpp", "hh", "hxx"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-cpp"
rev = "f41e1a044c8a84ea9fa8577fdd2eab92ec96de02"
block_kinds = [
    "function_definition",
    "class_specifier",
    "struct_specifier",
    "union_specifier",
    "enum_specifier",
    "namespace_definition",
    "template_declaration",
    "lambda_expression",
    "if_statement",
    "for_statement",
    "for_range_loop",
    "while_statement",
    "do_statement",
    "switch_statement",
    "try_statement",
]
