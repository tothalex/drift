# Curated by drift. Install: drift lang install csharp
name = "csharp"
extensions = ["cs"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-c-sharp"
rev = "cac6d5fb595f5811a076336682d5d595ac1c9e85"
symbol = "tree_sitter_c_sharp"
block_kinds = [
    "class_declaration",
    "struct_declaration",
    "interface_declaration",
    "enum_declaration",
    "record_declaration",
    "namespace_declaration",
    "method_declaration",
    "constructor_declaration",
    "property_declaration",
    "local_function_statement",
    "if_statement",
    "for_statement",
    "foreach_statement",
    "while_statement",
    "do_statement",
    "switch_statement",
    "try_statement",
    "using_statement",
]
