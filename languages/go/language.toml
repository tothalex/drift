# Curated by drift. Built in — installing makes it an editable plugin
# that overrides the built-in, starting from drift's full query stack.
# The rev matches the grammar crate the binary links (v0.25.0).
name = "go"
extensions = ["go"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-go"
rev = "6048bfc6e5238eaf062c2221bd934489c39fbb61"
block_kinds = [
    "function_declaration",
    "method_declaration",
    "type_declaration",
    "if_statement",
    "for_statement",
    "expression_switch_statement",
    "type_switch_statement",
    "select_statement",
]
