# Curated by drift. Install: drift lang install java
name = "java"
extensions = ["java"]

[grammar]
repo = "https://github.com/tree-sitter/tree-sitter-java"
rev = "e10607b45ff745f5f876bfa3e94fbcc6b44bdc11"
block_kinds = [
    "class_declaration",
    "interface_declaration",
    "enum_declaration",
    "record_declaration",
    "method_declaration",
    "constructor_declaration",
    "if_statement",
    "for_statement",
    "enhanced_for_statement",
    "while_statement",
    "do_statement",
    "switch_expression",
    "try_statement",
]
